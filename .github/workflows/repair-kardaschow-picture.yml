name: Repair exact-frame Kardaschow picture section
on:
  push:
    branches: [cosmos-universum-v2]
    paths: [.github/workflows/repair-kardaschow-picture.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  picture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        part: [4]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build and verify silent final picture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd cosmos/003-kardaschow
          python3 -u render.py --part ${{ matrix.part }} --prepare --upload --jobs 2 > picture-render.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kardaschow-picture-report-repair-${{ matrix.part }}
          path: |
            cosmos/003-kardaschow/picture-render.log
            cosmos/003-kardaschow/picture_*.verification.json
            cosmos/003-kardaschow/picture_*.upload.json
          retention-days: 7

