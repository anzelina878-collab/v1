name: Repair verified Earth night texture
on:
  push:
    branches: [cosmos-universum-v2]
    paths: [.github/workflows/repair-kardaschow-v2-night.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scene: [earth_night]
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blender ffmpeg xvfb libgl1-mesa-dri
      - name: Fetch verified licensed texture
        run: |
          cd cosmos/003-kardaschow-v2
          mkdir -p textures
          python3 - <<'PYCODE'
          import urllib.request,http.cookiejar,hashlib,pathlib
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar));url='https://filebin.net/77fae7c59a14d885deea6dd4bc634be3/earth_night.jpg'
          with op.open(urllib.request.Request(url,headers={'Range':'bytes=0-31'}),timeout=60) as f:f.read(64)
          data=op.open(url,timeout=60).read();assert hashlib.sha256(data).hexdigest()=='c16fd1bc096ab91a5c5265c6ff9847c43f489f2e2ee790ccdbcbd03251cf3a5a';assert data[:2]==bytes([255,216]);pathlib.Path('textures/earth_night.jpg').write_bytes(data)
          PYCODE
      - name: Render original Full HD scene
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_CACHE_HOME: /tmp/kosmion-render-cache
        run: |
          cd cosmos/003-kardaschow-v2
          xvfb-run -a blender -b -t 2 -P make3d.py -- ${{ matrix.scene }} > scene-render.log 2>&1
          ffmpeg -y -v warning -framerate 10 -i 3d/${{ matrix.scene }}/frame_%04d.jpg -vf framerate=fps=25 -t 30 -an -c:v libx264 -preset veryfast -crf 18 -threads 2 -filter_threads 2 -pix_fmt yuv420p ${{ matrix.scene }}.mp4
          ffmpeg -y -v error -ss 8 -i ${{ matrix.scene }}.mp4 -frames:v 1 pilot.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kardaschow-v2-night-${{ matrix.scene }}
          path: |
            cosmos/003-kardaschow-v2/${{ matrix.scene }}.mp4
            cosmos/003-kardaschow-v2/pilot.jpg
            cosmos/003-kardaschow-v2/scene-render.log
          retention-days: 7
