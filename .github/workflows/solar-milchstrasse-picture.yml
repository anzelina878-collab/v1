name: Use authentic solar observations in the final KOSMION documentary
on:
  push:
    branches: [cosmos-004-milchstrasse]
    paths: [.github/workflows/solar-milchstrasse-picture.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  picture:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [1]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build and verify silent final picture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd cosmos/004-milchstrasse
          python3 -u render.py --part ${{ matrix.part }} --prepare --jobs 2 > picture-render.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milchstrasse-authenticated-picture-${{ matrix.part }}
          path: |
            cosmos/004-milchstrasse/picture_01.mp4
            cosmos/004-milchstrasse/picture-render.log
            cosmos/004-milchstrasse/picture_*.verification.json
            cosmos/004-milchstrasse/picture_*.upload.json
          retention-days: 1
