name: Render refined cosmic and horizon spatial scenes
on:
  push:
    branches: [cosmos-006-quantum-observer]
    paths: [.github/workflows/render-quantum-observer-space.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scene: ['cosmos_wide', 'cosmos_close', 'horizon_wide', 'horizon_close']
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blender ffmpeg xvfb libgl1-mesa-dri
      - name: Render original spatial illustration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_CACHE_HOME: /tmp/kosmion-cache
        run: |
          cd cosmos/006-quantum-observer
          xvfb-run -a blender -b -t 2 -P make3d.py -- ${{ matrix.scene }} > scene-render.log 2>&1
          test -f 3d/${{ matrix.scene }}/frame-0481.jpg
          ffmpeg -y -v warning -framerate 12 -i 3d/${{ matrix.scene }}/frame-%04d.jpg -vf framerate=fps=25 -t 40 -an -c:v libx264 -preset veryfast -crf 18 -threads 2 -filter_threads 2 -pix_fmt yuv420p ${{ matrix.scene }}.mp4
          ffmpeg -v error -i ${{ matrix.scene }}.mp4 -f null -
          ffmpeg -y -v error -ss 13 -i ${{ matrix.scene }}.mp4 -frames:v 1 pilot.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-refined-scene-${{ matrix.scene }}
          path: |
            cosmos/006-quantum-observer/${{ matrix.scene }}.mp4
            cosmos/006-quantum-observer/pilot.jpg
            cosmos/006-quantum-observer/scene-render.log
          retention-days: 7
