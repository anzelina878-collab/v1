name: Publish one complete KOSMION Quantum Observer documentary
on:
  push:
    branches: [cosmos-006-quantum-observer]
    paths: [.github/workflows/publish-quantum-observer.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the verified complete final movie
        env:
          COMPLETED_MOVIE: '{"url":"https://filebin.net/344c948fcb7136f03660cb80b5cfcf2d/Quantenbeobachter_KOSMION_1080p.mp4","filename":"Quantenbeobachter_KOSMION_1080p.mp4","bytes":669834029,"sha256":"a8eff13524a33a58cb959ac06070e86cda61d3431de8aa65801d4caf6669a3ec","duration":1746.8}'
        run: |
          python3 - <<'PYCODE'
          import urllib.request,http.cookiejar,pathlib,hashlib,os,json
          cfg=json.loads(os.environ['COMPLETED_MOVIE']);dest=pathlib.Path(cfg['filename']);jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar));h=hashlib.sha256();count=0
          for attempt in range(3):
              with op.open(urllib.request.Request(cfg['url'],headers={'Range':'bytes=0-31'}),timeout=90) as response:
                  header=response.read(32)
              if header[4:8]==b'ftyp':break
          assert header[4:8]==b'ftyp'
          with op.open(cfg['url'],timeout=600) as response,open(dest,'wb') as output:
              while data:=response.read(1024*1024):output.write(data);h.update(data);count+=len(data)
          assert count==cfg['bytes']==dest.stat().st_size;assert h.hexdigest()==cfg['sha256']
          print('One complete final MP4 verified:',count,h.hexdigest())
          PYCODE
      - name: Publish one finished MP4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          Wer beobachtet das Universum, wenn niemand hinsieht?

          Vollständige deutsche Dokumentation: 29:07, 1920 × 1080, 25 Bilder pro Sekunde, H.264 und AAC.

          Ein vollständiger MP4-Film mit der gelieferten Erzählstimme, wissenschaftlichen dreidimensionalen Visualisierungen, ausgewählten echten Archivaufnahmen und Beobachtungen sowie sparsamer deutscher Typografie. Kleine Bildnachweise stehen direkt in den ausgewählten Archivaufnahmen.

          Quellen, Urheber und Lizenzen: [SOURCES.md](https://github.com/anzelina878-collab/v1/blob/cosmos-006-quantum-observer/cosmos/006-quantum-observer/SOURCES.md).
          Qualitätsprüfung: [QUALITY_REPORT.md](https://github.com/anzelina878-collab/v1/blob/cosmos-006-quantum-observer/cosmos/006-quantum-observer/QUALITY_REPORT.md).
          NOTES
          gh release create cosmos-006-quantum-observer --target "${{ github.sha }}" --title "KOSMION · Quantenbeobachter · Vollständiger Film · 1080p" --notes-file release-notes.md
          gh release upload cosmos-006-quantum-observer Quantenbeobachter_KOSMION_1080p.mp4 --clobber
