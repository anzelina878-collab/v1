name: Render remaining KOSMION quantum scenes reliably
on:
  push:
    branches: [cosmos-006-quantum-observer]
    paths: [.github/workflows/render-quantum-observer-reliable.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      scenes: ${{ steps.select.outputs.scenes }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os,re
          repo=os.environ['GH_REPO'];expected={f'{a}_{b}' for a in ['lab','slits','detector','decoherence','field','thermal','horizon','branches','signal','cosmos','acceleration','records','curvature','chamber','scale'] for b in ['wide','close']}
          runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/render-quantum-observer-efficient.yml/runs?branch=cosmos-006-quantum-observer&per_page=5']))['workflow_runs'];run=runs[0]
          arts=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100"]))['artifacts'];ready={a['name'].removeprefix('quantum-efficient-scene-') for a in arts if a['size_in_bytes']>1000000}
          jobs=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"]))['jobs'];rendering=set()
          for j in jobs:
              m=re.fullmatch(r'scene \((.+)\)',j['name'])
              if m and any(s['name']=='Render original Full HD spatial illustration' and s['status']=='in_progress' for s in j.get('steps',[])):rendering.add(m[1])
          remaining=sorted(expected-ready-rendering)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('scenes='+json.dumps(remaining)+'\nany='+str(bool(remaining)).lower()+'\n')
          print('Already rendered:',len(ready),'Currently rendering:',len(rendering),'Remaining:',len(remaining))
          PYCODE
  scene:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        scene: ${{ fromJson(needs.select.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools from bounded Ubuntu sources
        run: |
          cat > /tmp/kosmion-render.list <<'SOURCES'
          deb https://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
          deb https://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse
          SOURCES
          sudo timeout 180 apt-get -o Dir::Etc::sourcelist=/tmp/kosmion-render.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 300 apt-get -o Dir::Etc::sourcelist=/tmp/kosmion-render.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq --no-install-recommends blender ffmpeg xvfb libgl1-mesa-dri
      - name: Render original Full HD spatial illustration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_CACHE_HOME: /tmp/kosmion-cache
          KOSMION_EFFICIENT_RENDER: '1'
        run: |
          cd cosmos/006-quantum-observer
          if [[ '${{ matrix.scene }}' == scale_* ]]; then curl --fail --location --retry 3 -o earth_daymap.jpg https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg; fi
          xvfb-run -a blender -b -t 2 --python-exit-code 1 -P make3d.py -- ${{ matrix.scene }} > scene-render.log 2>&1
          test -f 3d/${{ matrix.scene }}/frame-0241.jpg
          ffmpeg -y -v warning -framerate 6 -i 3d/${{ matrix.scene }}/frame-%04d.jpg -vf framerate=fps=25 -t 40 -an -c:v libx264 -preset veryfast -crf 18 -threads 2 -filter_threads 2 -pix_fmt yuv420p ${{ matrix.scene }}.mp4
          ffmpeg -v error -i ${{ matrix.scene }}.mp4 -f null -
          ffmpeg -y -v error -ss 13 -i ${{ matrix.scene }}.mp4 -frames:v 1 pilot.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-reliable-scene-${{ matrix.scene }}
          path: |
            cosmos/006-quantum-observer/${{ matrix.scene }}.mp4
            cosmos/006-quantum-observer/pilot.jpg
            cosmos/006-quantum-observer/scene-render.log
          retention-days: 7
