name: Render final time-arrow documentary
on:
  push:
    branches: [cosmos-universum-v2]
    paths: [.github/workflows/render-zeitpfeil-final.yml]
permissions:
  contents: read
  actions: read
jobs:
  cancel_obsolete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST repos/$GH_REPO/actions/runs/43428777963/cancel || true
  picture:
    needs: cancel_obsolete
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08372d3e1367f66232de050ba6cfebb0e305ec65
          sparse-checkout: cosmos/002-zeitpfeil
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render and verify final silent picture
        working-directory: cosmos/002-zeitpfeil
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 render.py --part ${{ matrix.part }} --prepare --upload --jobs 2 > picture-render.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeitpfeil-picture-report-${{ matrix.part }}
          path: |
            cosmos/002-zeitpfeil/picture-render.log
            cosmos/002-zeitpfeil/picture_*.verification.json
            cosmos/002-zeitpfeil/picture_*.upload.json
            cosmos/002-zeitpfeil/logs/*recovery*.log
          retention-days: 7
